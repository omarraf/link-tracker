<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h2>Link Tracker</h2>

        <div class="input-section">
            <input type="url" id="linkInput" placeholder="Enter or paste URL here">
            <div class="button-group">
                <button id="saveCurrentBtn">Save Current Page</button>
                <button id="addLinkBtn">Add Link</button>
            </div>
        </div>

        <div class="links-section">
            <h3>Saved Links</h3>
            <div id="linksList" class="links-list">
                <p class="no-links">No links saved yet</p>
            </div>
        </div>

        <div class="actions">
            <button id="copyAllBtn">Copy All Links</button>
            <button id="clearAllBtn">Clear All</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
